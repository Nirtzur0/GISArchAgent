<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">GISArchAgent logo</title>
  <desc id="logoDesc">A polished rounded-square mark with topographic lines and an architectural A around a site marker.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="0.52" stop-color="#e3e9f1" />
      <stop offset="1" stop-color="#cbd3de" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(82 56) rotate(41.5) scale(146.086 138.78)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="64" y1="48" x2="192" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="1" stop-color="#eef3f8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="contour" x1="56" y1="68" x2="208" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6eaeb5" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#4c98a2" stop-opacity="0.34" />
      <stop offset="1" stop-color="#6eaeb5" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="site" x1="116" y1="132" x2="142" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5b08b" />
      <stop offset="1" stop-color="#c56b43" />
    </linearGradient>
    <filter id="surfaceShadow" x="6" y="8" width="244" height="244" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#617086" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.66" />
    </filter>
  </defs>
  <g filter="url(#surfaceShadow)">
    <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg)" />
    <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#sheen)" />
    <rect x="34" y="34" width="188" height="188" rx="46" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.5" />
    <path d="M50 86c18-18 40-28 68-28 26 0 42 8 66 8 12 0 24-2 38-7" fill="none" stroke="url(#contour)" stroke-linecap="round" stroke-width="7" />
    <path d="M42 118c20-19 44-30 73-30 23 0 40 7 61 7 16 0 31-4 44-11" fill="none" stroke="url(#contour)" stroke-linecap="round" stroke-width="7" />
    <path d="M40 170c18-17 39-27 63-27 23 0 39 7 60 7 18 0 34-5 53-16" fill="none" stroke="url(#contour)" stroke-linecap="round" stroke-width="7" />
    <path d="M66 206c8-13 20-21 35-25 16-4 30-2 46-2 18 0 36-5 58-17" fill="none" stroke="url(#contour)" stroke-linecap="round" stroke-width="6" />
    <path d="M96 178 128 92l32 86" fill="none" stroke="#20293a" stroke-linecap="round" stroke-linejoin="round" stroke-width="18" />
    <path d="M109 147h38" fill="none" stroke="#20293a" stroke-linecap="round" stroke-width="12" />
    <circle cx="128" cy="147" r="12" fill="url(#site)" stroke="#f7fbff" stroke-width="4" />
  </g>
